<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>晃広&まどか ウェディングラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF8F2;
    --ivory-deep:#F3EBDD;
    --sage:#8C9C7E;
    --sage-deep:#5C6B4F;
    --rose:#D9A6A0;
    --rose-deep:#B97D77;
    --gold:#C6A25B;
    --ink:#3E4A3D;
    --ink-soft:#6b7565;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(217,166,160,.14), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(140,156,126,.14), transparent 55%),
      var(--ivory);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 18px 40px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:.14em;
    color:var(--rose-deep);
    font-size:14px;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:.04em;
  }
  .hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:760px;
    aspect-ratio:800/300;
    background:var(--ivory-deep);
    border-radius:18px;
    border:1px solid rgba(140,156,126,.3);
    overflow:hidden;
    touch-action:manipulation;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(251,248,242,.88);
    gap:10px;
    padding:20px;
  }
  .overlay.hidden{display:none;}
  .overlay .msg-title{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
  }
  .overlay .msg-sub{
    font-size:13px;
    color:var(--ink-soft);
  }
  .btn{
    margin-top:6px;
    padding:12px 30px;
    border-radius:999px;
    border:none;
    background:var(--sage-deep);
    color:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .btn:active{transform:translateY(1px);}
  .retry-row{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--sage-deep);
    color:var(--sage-deep);
    margin-top:0;
  }
  .name-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .name-row input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid var(--sage);
    background:#fff;
    color:var(--ink);
    width:160px;
    outline:none;
  }
  .name-row input:focus{border-color:var(--sage-deep);}
  .name-row button{
    padding:10px 20px;
    border-radius:999px;
    border:none;
    background:var(--rose-deep);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .char-row{
    display:flex;
    gap:22px;
    margin-top:6px;
  }
  .char-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
  }
  .char-card img{
    width:76px;
    height:76px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--ivory-deep);
    box-shadow:0 0 0 1px rgba(140,156,126,.4);
    transition:border-color .2s, transform .2s;
  }
  .char-card:hover img, .char-card:active img{
    border-color:var(--sage-deep);
    transform:scale(1.04);
  }
  .char-card span{
    font-size:13px;
    color:var(--ink);
    font-weight:700;
  }
  .score-row{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:760px;
    margin-top:14px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .score-row b{color:var(--ink);font-weight:700;}
  .board{
    width:100%;
    max-width:760px;
    margin-top:22px;
    background:var(--ivory-deep);
    border-radius:16px;
    padding:20px 24px;
    border:1px solid rgba(140,156,126,.25);
  }
  .board h2{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 12px;
  }
  .board ol{
    margin:0;
    padding:0 0 0 22px;
    font-size:14px;
  }
  .board li{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid rgba(140,156,126,.18);
  }
  .board li:last-child{border-bottom:none;}
  .board .name{color:var(--ink);}
  .board .pts{color:var(--sage-deep);font-weight:700;font-family:'Cormorant Garamond', serif;font-style:italic;}
  .board .empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}
</style>
</head>

<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 800, H = 300;
  canvas.width = W; canvas.height = H;

  const groundY = 235;
  const colors = {
    ink:'#3E4A3D', sage:'#8C9C7E', sageDeep:'#5C6B4F',
    rose:'#D9A6A0', roseDeep:'#B97D77', gold:'#C6A25B', ivoryDeep:'#F3EBDD'
  };

  let selectedChar = null;
  let faceImg = new Image();
  let faceImgReady = false;

  let running = false;
  let over = false;
  let speed = 6.2;
  let score = 0;
  let best = 0;
  let frame = 0;
  let obstacles = [];
  let popups = [];
  let nextSpawn = 60;
  let groundOffset = 0;

  const runner = {
    x: 90, y: groundY, w: 34, h: 46,
    vy: 0, gravity: 0.62, jumpV: -11.6,
    onGround: true, legPhase: 0
  };

  function resetGame(){
    speed = 6.2; score = 0; frame = 0; obstacles = []; popups = [];
    nextSpawn = 60; groundOffset = 0;
    runner.y = groundY; runner.vy = 0; runner.onGround = true; runner.legPhase = 0;
    over = false;
  }

  function jump(){
    if(!running){
      startGame();
      return;
    }
    if(over){ return; }
    if(runner.onGround){
      runner.vy = runner.jumpV;
      runner.onGround = false;
    }
  }

  function startGame(){
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('overOverlay').classList.add('hidden');
    resetGame();
    running = true;
  }

  function spawnObstacle(){
    const isObstacle = Math.random() < 0.42;
    const isAir = Math.random() < 0.45;
    if(isObstacle){
      const types = ['paper','storm','clock'];
      const t = types[Math.floor(Math.random()*types.length)];
      let h, w;
      if(t==='paper'){ w=28; h=40; }
      else if(t==='storm'){ w=38; h=28; }
      else { w=30; h=30; }
      const y = isAir ? (groundY - h - (58 + Math.random()*34)) : (groundY - h);
      obstacles.push({ x: W+20, y, w, h, type:t, kind:'obstacle', air:isAir });
    } else {
      const types = ['glass','gift','bouquet'];
      const t = types[Math.floor(Math.random()*types.length)];
      let h, w;
      if(t==='glass'){ w=22; h=40; }
      else if(t==='gift'){ w=30; h=30; }
      else { w=28; h=36; }
      const y = isAir ? (groundY - h - (20 + Math.random()*68)) : (groundY - h);
      obstacles.push({ x: W+20, y, w, h, type:t, kind:'collectible', collected:false, air:isAir });
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    frame++;
    groundOffset -= speed;
    if(groundOffset < -40) groundOffset += 40;

    speed = Math.min(13, speed + 0.0018);

    runner.vy += runner.gravity;
    runner.y += runner.vy;
    if(runner.y > groundY){ runner.y = groundY; runner.vy = 0; runner.onGround = true; }

    if(runner.onGround){ runner.legPhase += 0.35; }

    nextSpawn--;
    if(nextSpawn <= 0){
      spawnObstacle();
      nextSpawn = 55 + Math.random()*55 - speed*2;
      if(nextSpawn < 35) nextSpawn = 35;
    }

    for(const o of obstacles){ o.x -= speed; }

    const rHit = { x: runner.x+8, y: runner.y-runner.h+8, w: runner.w-16, h: runner.h-10 };
    for(const o of obstacles){
      if(o.kind === 'collectible' && o.collected) continue;
      const oHit = { x:o.x+4, y:o.y+4, w:o.w-8, h:o.h-8 };
      if(rectsOverlap(rHit, oHit)){
        if(o.kind === 'obstacle'){
          endGame();
          return;
        } else {
          o.collected = true;
          score += 10;
          popups.push({ x:o.x, y:o.y, life:34 });
        }
      }
    }

    obstacles = obstacles.filter(o => o.x + o.w > -10 && !(o.kind==='collectible' && o.collected));

    for(const p of popups){ p.y -= 0.6; p.life--; }
    popups = popups.filter(p => p.life > 0);

    score += speed*0.045;
    document.getElementById('liveScore').textContent = Math.floor(score);
  }

  function drawGround(){
    ctx.strokeStyle = colors.sageDeep;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.setLineDash([2,10]);
    ctx.beginPath();
    ctx.moveTo(0, groundY+2);
    ctx.lineTo(W, groundY+2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawRunner(){
    const x = runner.x, yBase = runner.y;
    ctx.save();
    ctx.translate(x, yBase);

    // legs (behind body)
    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    const swing = runner.onGround ? Math.sin(runner.legPhase)*10 : 4;
    ctx.beginPath();
    ctx.moveTo(-6,-14); ctx.lineTo(-6+swing, 1);
    ctx.moveTo(6,-14); ctx.lineTo(6-swing, 1);
    ctx.stroke();

    // body
    ctx.fillStyle = colors.roseDeep;
    ctx.beginPath();
    ctx.roundRect(-14, -runner.h+8, 28, 26, 9);
    ctx.fill();

    // head: clipped photo if ready, otherwise a soft placeholder
    const headR = 15;
    const headCX = 0, headCY = -runner.h-4;
    if(faceImgReady){
      ctx.save();
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(faceImg, headCX-headR, headCY-headR, headR*2, headR*2);
      ctx.restore();
      ctx.strokeStyle = '#FBF8F2';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(140,156,126,.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR+1.4, 0, Math.PI*2);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#F5EEE3';
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.fill();
    }

    // accessory: bowtie for groom, flower clip for bride
    if(selectedChar === 'madoka'){
      ctx.fillStyle = colors.rose;
      ctx.beginPath();
      ctx.arc(headCX+headR-4, headCY-headR+5, 4.5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = colors.gold;
      ctx.beginPath();
      ctx.arc(headCX+headR-4, headCY-headR+5, 1.6, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = colors.gold;
      ctx.beginPath();
      ctx.moveTo(-5,-runner.h+7);
      ctx.lineTo(0,-runner.h+11);
      ctx.lineTo(5,-runner.h+7);
      ctx.lineTo(0,-runner.h+3);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawObstacleShape(o){
    ctx.save();
    ctx.translate(o.x, o.y);
    if(o.type==='paper'){
      // tilted stack of documents with a binder clip, like an overtime paperwork pile
      ctx.save();
      ctx.translate(o.w/2, o.h/2);
      ctx.rotate(-0.05);
      ctx.translate(-o.w/2, -o.h/2);
      for(let i=0;i<4;i++){
        const yy = o.h - (i+1)*9 - 4;
        const shrink = i*1.4;
        ctx.fillStyle = i%2===0 ? '#F3EBDD' : '#EFE6D4';
        ctx.strokeStyle = colors.ink;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.roundRect(2+shrink, yy, o.w-4-shrink*2, 9, 1.5);
        ctx.fill(); ctx.stroke();
        ctx.strokeStyle = 'rgba(62,74,61,0.5)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(6+shrink, yy+5); ctx.lineTo(o.w-8-shrink, yy+5);
        ctx.stroke();
      }
      ctx.fillStyle = colors.ink;
      ctx.beginPath();
      ctx.roundRect(o.w*0.34, o.h-9, o.w*0.32, 6, 2);
      ctx.fill();
      ctx.restore();
    } else if(o.type==='storm'){
      // layered puffy cloud with rain streaks and a bright lightning bolt
      ctx.fillStyle = '#DCE3D4';
      ctx.strokeStyle = colors.sageDeep;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.arc(o.w*0.30, o.h*0.42, 9.5, 0, Math.PI*2);
      ctx.arc(o.w*0.52, o.h*0.28, 12, 0, Math.PI*2);
      ctx.arc(o.w*0.76, o.h*0.40, 9, 0, Math.PI*2);
      ctx.arc(o.w*0.5, o.h*0.5, 13, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(140,156,126,0.55)';
      ctx.lineWidth = 1.4;
      ctx.lineCap = 'round';
      for(let i=0;i<3;i++){
        const rx = o.w*0.28 + i*(o.w*0.24);
        ctx.beginPath();
        ctx.moveTo(rx, o.h*0.66);
        ctx.lineTo(rx-3, o.h*0.82);
        ctx.stroke();
      }
      ctx.fillStyle = colors.gold;
      ctx.strokeStyle = colors.roseDeep;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(o.w*0.54, o.h*0.56);
      ctx.lineTo(o.w*0.40, o.h*0.80);
      ctx.lineTo(o.w*0.50, o.h*0.80);
      ctx.lineTo(o.w*0.38, o.h);
      ctx.lineTo(o.w*0.62, o.h*0.74);
      ctx.lineTo(o.w*0.50, o.h*0.74);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else {
      // alarm clock, bells on top, hands past the hour, small "missed" badge
      const r = o.w/2 - 3;
      const ccx = o.w/2, ccy = o.h/2+2;
      ctx.strokeStyle = colors.ink;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ccx-r*0.72, ccy-r*0.85, 4.5, -0.4, 2.6); ctx.stroke();
      ctx.beginPath();
      ctx.arc(ccx+r*0.72, ccy-r*0.85, 4.5, Math.PI-2.6, Math.PI+0.4); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(ccx-r*0.55,ccy-r*1.05); ctx.lineTo(ccx-r*0.85,ccy-r*1.5);
      ctx.moveTo(ccx+r*0.55,ccy-r*1.05); ctx.lineTo(ccx+r*0.85,ccy-r*1.5);
      ctx.stroke();
      ctx.fillStyle = '#FBF8F2';
      ctx.beginPath();
      ctx.arc(ccx, ccy, r, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(62,74,61,0.55)';
      ctx.lineWidth = 1.3;
      for(let i=0;i<12;i++){
        const a = i*Math.PI/6;
        const inR = r-2.5, outR = r-0.5;
        ctx.beginPath();
        ctx.moveTo(ccx+Math.cos(a)*inR, ccy+Math.sin(a)*inR);
        ctx.lineTo(ccx+Math.cos(a)*outR, ccy+Math.sin(a)*outR);
        ctx.stroke();
      }
      ctx.strokeStyle = colors.ink;
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ccx,ccy); ctx.lineTo(ccx, ccy-r*0.55);
      ctx.moveTo(ccx,ccy); ctx.lineTo(ccx+r*0.5, ccy+r*0.25);
      ctx.stroke();
      ctx.fillStyle = colors.roseDeep;
      ctx.beginPath();
      ctx.arc(ccx+r*0.62, ccy-r*0.62, 5.2, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#FBF8F2';
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(ccx+r*0.62-2.6, ccy-r*0.62-2.6);
      ctx.lineTo(ccx+r*0.62+2.6, ccy-r*0.62+2.6);
      ctx.moveTo(ccx+r*0.62+2.6, ccy-r*0.62-2.6);
      ctx.lineTo(ccx+r*0.62-2.6, ccy-r*0.62+2.6);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCollectible(o){
    if(o.collected) return;
    ctx.save();
    ctx.translate(o.x, o.y);
    if(o.type==='glass'){
      ctx.strokeStyle = colors.sageDeep;
      ctx.fillStyle = 'rgba(198,162,91,0.28)';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(2,0); ctx.lineTo(o.w-2,0);
      ctx.lineTo(o.w/2+5, o.h*0.55); ctx.lineTo(o.w/2-5, o.h*0.55);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(251,248,242,0.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(o.w*0.62, o.h*0.08); ctx.lineTo(o.w*0.56, o.h*0.42);
      ctx.stroke();
      ctx.fillStyle = colors.gold;
      ctx.beginPath(); ctx.arc(o.w*0.42, o.h*0.30, 1.4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.w*0.52, o.h*0.18, 1.1, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(o.w*0.46, o.h*0.42, 1, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = colors.sageDeep;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(o.w/2, o.h*0.55); ctx.lineTo(o.w/2, o.h-4);
      ctx.moveTo(o.w/2-7, o.h-4); ctx.lineTo(o.w/2+7, o.h-4);
      ctx.stroke();
    } else if(o.type==='gift'){
      ctx.strokeStyle = colors.gold;
      ctx.fillStyle = '#F3EBDD';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.roundRect(0,o.h*0.28,o.w,o.h*0.72,3);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(198,162,91,0.35)';
      ctx.beginPath();
      ctx.roundRect(0,o.h*0.20,o.w,o.h*0.16,2);
      ctx.fill(); ctx.stroke();
      ctx.strokeStyle = colors.roseDeep;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.moveTo(o.w/2,o.h*0.20); ctx.lineTo(o.w/2,o.h);
      ctx.stroke();
      ctx.fillStyle = colors.roseDeep;
      ctx.beginPath();
      ctx.ellipse(o.w/2-5, o.h*0.14, 5, 3.4, 0.5, 0, Math.PI*2);
      ctx.ellipse(o.w/2+5, o.h*0.14, 5, 3.4, -0.5, 0, Math.PI*2);
      ctx.fill();
    } else {
      const petals = [
        {dx:-8, c:'rgba(217,166,160,0.5)'},
        {dx:0,  c:'rgba(198,162,91,0.5)'},
        {dx:8,  c:'rgba(140,156,126,0.45)'}
      ];
      ctx.strokeStyle = colors.roseDeep;
      ctx.lineWidth = 1.6;
      for(const p of petals){
        ctx.fillStyle = p.c;
        ctx.beginPath();
        ctx.arc(o.w/2 + p.dx, o.h*0.32, 7.5, 0, Math.PI*2);
        ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = colors.sageDeep;
      ctx.beginPath();
      ctx.ellipse(o.w/2-11, o.h*0.42, 4, 2, 0.7, 0, Math.PI*2);
      ctx.ellipse(o.w/2+11, o.h*0.42, 4, 2, -0.7, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = colors.sageDeep;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(o.w/2,o.h*0.44); ctx.lineTo(o.w/2,o.h);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawPopups(){
    ctx.font = 'bold 15px "Cormorant Garamond", serif';
    ctx.fillStyle = colors.gold;
    for(const p of popups){
      ctx.globalAlpha = Math.max(0, p.life/34);
      ctx.fillText('+10', p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawGround();
    for(const o of obstacles){
      if(o.kind === 'obstacle'){ drawObstacleShape(o); }
      else { drawCollectible(o); }
    }
    drawPopups();
    drawRunner();
  }

  function loop(){
    if(running && !over){ update(); }
    render();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    over = true;
    const finalScore = Math.floor(score);
    if(finalScore > best){
      best = finalScore;
      saveBest(best);
    }
    document.getElementById('overScore').textContent = 'スコア: ' + finalScore;
    document.getElementById('bestLine').textContent = '自己ベスト: ' + best;
    document.getElementById('liveBest').textContent = best;
    document.getElementById('overOverlay').classList.remove('hidden');
    window.__lastScore = finalScore;
  }

  async function saveBest(v){
    try{
      await window.storage.set('wedding-run-personal-best', String(v), false);
    }catch(e){}
  }

  async function loadBest(){
    try{
      const r = await window.storage.get('wedding-run-personal-best', false);
      if(r && r.value){ best = parseInt(r.value,10) || 0; }
    }catch(e){}
    document.getElementById('liveBest').textContent = best;
  }

  async function loadLeaderboard(){
    const listEl = document.getElementById('rankList');
    try{
      const r = await window.storage.get('wedding-run-leaderboard', true);
      const arr = r && r.value ? JSON.parse(r.value) : [];
      renderLeaderboard(arr);
    }catch(e){
      renderLeaderboard([]);
    }
  }

  function renderLeaderboard(arr){
    const listEl = document.getElementById('rankList');
    if(!arr || arr.length === 0){
      listEl.innerHTML = '<li class="empty">まだ記録がありません。最初の挑戦者になろう!</li>';
      return;
    }
    listEl.innerHTML = arr.slice(0,10).map(item =>
      `<li><span class="name">${escapeHtml(item.name)}</span><span class="pts">${item.score}</span></li>`
    ).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function submitScore(){
    const nameInput = document.getElementById('nameInput');
    const name = (nameInput.value || 'ゲスト').trim().slice(0,12) || 'ゲスト';
    const s = window.__lastScore || 0;

    let arr = [];
    try{
      const r = await window.storage.get('wedding-run-leaderboard', true);
      arr = r && r.value ? JSON.parse(r.value) : [];
    }catch(e){
      arr = [];
    }

    arr.push({ name, score: s });
    arr.sort((a,b)=>b.score-a.score);
    arr = arr.slice(0,10);

    try{
      await window.storage.set('wedding-run-leaderboard', JSON.stringify(arr), true);
      renderLeaderboard(arr);
      nameInput.value = '';
      nameInput.placeholder = '登録しました!';
    }catch(e){
      nameInput.placeholder = '登録に失敗しました';
    }
  }

  function backToTop(){
    running = false;
    over = true;
    selectedChar = null;
    faceImgReady = false;
    document.getElementById('overOverlay').classList.add('hidden');
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('selectOverlay').classList.remove('hidden');
  }

  document.getElementById('retryBtn').addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  document.getElementById('backToTopBtn').addEventListener('click', (e)=>{ e.stopPropagation(); backToTop(); });
  document.getElementById('submitScore').addEventListener('click', (e)=>{ e.stopPropagation(); submitScore(); });
  document.getElementById('nameInput').addEventListener('click', (e)=>{ e.stopPropagation(); });
  document.getElementById('nameInput').addEventListener('keydown', (e)=>{ e.stopPropagation(); });

  document.querySelectorAll('.char-card').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      selectedChar = btn.dataset.char;
      faceImgReady = false;
      const img = new Image();
      img.onload = function(){ faceImg = img; faceImgReady = true; };
      img.src = btn.querySelector('img').src;
      document.getElementById('selectOverlay').classList.add('hidden');
      document.getElementById('startOverlay').classList.remove('hidden');
    });
  });

  document.getElementById('stage').addEventListener('pointerdown', (e)=>{
    if(!selectedChar) return;
    if(document.getElementById('overOverlay').classList.contains('hidden')===false) return;
    jump();
  });
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      if(!selectedChar) return;
      if(document.getElementById('overOverlay').classList.contains('hidden')===false) return;
      jump();
    }
  });

  loadBest();
  loadLeaderboard();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
