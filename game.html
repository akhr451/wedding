<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>晃広&まどか ウェディングラン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF8F2;
    --ivory-deep:#F3EBDD;
    --sage:#8C9C7E;
    --sage-deep:#5C6B4F;
    --rose:#D9A6A0;
    --rose-deep:#B97D77;
    --gold:#C6A25B;
    --ink:#3E4A3D;
    --ink-soft:#6b7565;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100svh;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(217,166,160,.14), transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(140,156,126,.14), transparent 55%),
      var(--ivory);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 18px 40px;
  }
  .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    letter-spacing:.14em;
    color:var(--rose-deep);
    font-size:14px;
    text-transform:uppercase;
    margin-bottom:4px;
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:24px;
    margin:0 0 4px;
    letter-spacing:.04em;
  }
  .hint{
    font-size:13px;
    color:var(--ink-soft);
    margin:0 0 18px;
  }
  .stage{
    position:relative;
    width:100%;
    max-width:760px;
    aspect-ratio:800/300;
    background:var(--ivory-deep);
    border-radius:18px;
    border:1px solid rgba(140,156,126,.3);
    overflow:hidden;
    touch-action:manipulation;
  }
  canvas{
    width:100%;
    height:100%;
    display:block;
  }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(251,248,242,.88);
    gap:10px;
    padding:20px;
    overflow-y:auto;
  }
  .overlay.hidden{display:none;}
  .overlay .msg-title{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:20px;
    color:var(--ink);
  }
  .overlay .msg-sub{
    font-size:13px;
    color:var(--ink-soft);
  }
  .btn{
    margin-top:6px;
    padding:12px 30px;
    border-radius:999px;
    border:none;
    background:var(--sage-deep);
    color:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .btn:active{transform:translateY(1px);}
  .retry-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-top:6px;
  }
  .btn-secondary{
    background:transparent;
    border:1px solid var(--sage-deep);
    color:var(--sage-deep);
    margin-top:0;
  }
  .name-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin-top:8px;
  }
  .name-row input{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:14px;
    padding:10px 14px;
    border-radius:999px;
    border:1px solid var(--sage);
    background:#fff;
    color:var(--ink);
    width:160px;
    max-width:52vw;
    outline:none;
  }
  .name-row input:focus{border-color:var(--sage-deep);}
  .name-row button{
    padding:10px 20px;
    border-radius:999px;
    border:none;
    background:var(--rose-deep);
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
  }

  .char-row{
    display:flex;
    gap:22px;
    margin-top:6px;
  }
  .char-card{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
  }
  .char-card img{
    width:76px;
    height:76px;
    border-radius:50%;
    object-fit:cover;
    border:3px solid var(--ivory-deep);
    box-shadow:0 0 0 1px rgba(140,156,126,.4);
    transition:border-color .2s, transform .2s;
  }
  .char-card:hover img, .char-card:active img{
    border-color:var(--sage-deep);
    transform:scale(1.04);
  }
  .char-card span{
    font-size:13px;
    color:var(--ink);
    font-weight:700;
  }
  .score-row{
    display:flex;
    justify-content:space-between;
    width:100%;
    max-width:760px;
    margin-top:14px;
    font-size:13px;
    color:var(--ink-soft);
  }
  .score-row b{color:var(--ink);font-weight:700;}
  .board{
    width:100%;
    max-width:760px;
    margin-top:22px;
    background:var(--ivory-deep);
    border-radius:16px;
    padding:20px 24px;
    border:1px solid rgba(140,156,126,.25);
  }
  .board h2{
    font-family:'Shippori Mincho', serif;
    font-weight:600;
    font-size:16px;
    margin:0 0 12px;
  }
  .board ol{
    margin:0;
    padding:0 0 0 22px;
    font-size:14px;
  }
  .board li{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    border-bottom:1px solid rgba(140,156,126,.18);
  }
  .board li:last-child{border-bottom:none;}
  .board .name{color:var(--ink);}
  .board .pts{color:var(--sage-deep);font-weight:700;font-family:'Cormorant Garamond', serif;font-style:italic;}
  .board .empty{color:var(--ink-soft);font-size:13px;padding:6px 0;}

  .jump-btn{
    display:none;
    width:100%;
    max-width:760px;
    margin-top:14px;
    padding:16px;
    border-radius:20px;
    border:none;
    background:var(--sage-deep);
    color:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.05em;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(92,107,79,.28);
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
    user-select:none;
  }
  .jump-btn:active{transform:translateY(1px);box-shadow:0 2px 8px rgba(92,107,79,.28);}
  @media (hover:none) and (pointer:coarse){
    .jump-btn{display:block;}
  }

  @media (max-width:600px){
    body{padding:20px 10px 32px;}
    .hint{font-size:12px;}
    .stage{aspect-ratio:4/3;}
  }
  @media (max-width:420px){
    .overlay{padding:14px;gap:8px;}
    .overlay .msg-title{font-size:18px;}
    .overlay .msg-sub{font-size:12.5px;}
    .char-row{gap:14px;}
  }
</style>
</head>
<body>

<div class="eyebrow">Wedding run</div>
<h1>晃広 & まどか ウェディングラン</h1>
<p class="hint">スペースキー・タップ・下のジャンプボタンでジャンプ。浮いている💐ブーケ・🍾シャンパン・🎁ギフトはジャンプで取ってポイントに、💻仕事・👹喧嘩・💸金欠(遊びすぎ注意)にぶつかるとゲームオーバー</p>

</div>

<button class="jump-btn" id="jumpBtn" type="button">↑ ジャンプ</button>

<div class="score-row">
  <span>スコア: <b id="liveScore">0</b></span>
  <span>自己ベスト: <b id="liveBest">0</b></span>
</div>

<div class="board">
  <h2>ゲストランキング</h2>
  <ol id="rankList"><li class="empty">読み込み中...</li></ol>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function(){
  // Firebase Realtime Database: 全ゲスト共通のランキング保存用。
  // セットアップ手順は firebase-setup.md を参照し、下記を実際の値に書き換えること。
  const firebaseConfig = {
    apiKey: "AIzaSyA6yohcA5f0BCHdhwyzkkYP2ZbzD7bA3r0",
    authDomain: "akihiro-madoka-wedding.firebaseapp.com",
    databaseURL: "https://akihiro-madoka-wedding-default-rtdb.firebaseio.com",
    projectId: "akihiro-madoka-wedding"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stageEl = document.getElementById('stage');
  let W = 800, H = 300;
  let groundY = 235;

  function resizeCanvas(){
    const rect = stageEl.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    W = Math.max(200, Math.round(rect.width));
    H = Math.max(120, Math.round(rect.height));
    groundY = H - 65;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(runner.onGround) runner.y = groundY;
  }
  const colors = {
    ink:'#3E4A3D', sage:'#8C9C7E', sageDeep:'#5C6B4F',
    rose:'#D9A6A0', roseDeep:'#B97D77', gold:'#C6A25B', ivoryDeep:'#F3EBDD'
  };

  let selectedChar = null;
  let faceImg = new Image();
  let faceImgReady = false;

  let running = false;
  let over = false;
  let speed = 6.2;
  let score = 0;
  let best = 0;
  let frame = 0;
  let obstacles = [];
  let popups = [];
  let nextSpawn = 60;
  let groundOffset = 0;

  const runner = {
    x: 90, y: groundY, w: 34, h: 46,
    vy: 0, gravity: 0.62, jumpV: -11.6,
    onGround: true, legPhase: 0
  };

  function resetGame(){
    speed = 6.2; score = 0; frame = 0; obstacles = []; popups = [];
    nextSpawn = 60; groundOffset = 0;
    runner.y = groundY; runner.vy = 0; runner.onGround = true; runner.legPhase = 0;
    over = false;
  }

  function jump(){
    if(!running){
      startGame();
      return;
    }
    if(over){ return; }
    if(runner.onGround){
      runner.vy = runner.jumpV;
      runner.onGround = false;
    }
  }

  function startGame(){
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('overOverlay').classList.add('hidden');
    resetGame();
    running = true;
  }

  function spawnObstacle(){
    const isObstacle = Math.random() < 0.42;
    const isAir = Math.random() < 0.45;
    if(isObstacle){
      const types = ['paper','storm','clock'];
      const t = types[Math.floor(Math.random()*types.length)];
      let h, w;
      if(t==='paper'){ w=28; h=40; }
      else if(t==='storm'){ w=38; h=28; }
      else { w=30; h=30; }
      const y = isAir ? (groundY - h - (58 + Math.random()*34)) : (groundY - h);
      obstacles.push({ x: W+20, y, w, h, type:t, kind:'obstacle', air:isAir });
    } else {
      const types = ['glass','gift','bouquet'];
      const t = types[Math.floor(Math.random()*types.length)];
      let h, w;
      if(t==='glass'){ w=22; h=40; }
      else if(t==='gift'){ w=30; h=30; }
      else { w=28; h=36; }
      const y = isAir ? (groundY - h - (20 + Math.random()*68)) : (groundY - h);
      obstacles.push({ x: W+20, y, w, h, type:t, kind:'collectible', collected:false, air:isAir });
    }
  }

  function rectsOverlap(a,b){
    return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
  }

  function update(){
    frame++;
    groundOffset -= speed;
    if(groundOffset < -40) groundOffset += 40;

    speed = Math.min(13, speed + 0.0018);

    runner.vy += runner.gravity;
    runner.y += runner.vy;
    if(runner.y > groundY){ runner.y = groundY; runner.vy = 0; runner.onGround = true; }

    if(runner.onGround){ runner.legPhase += 0.35; }

    nextSpawn--;
    if(nextSpawn <= 0){
      spawnObstacle();
      nextSpawn = 55 + Math.random()*55 - speed*2;
      if(nextSpawn < 35) nextSpawn = 35;
    }

    for(const o of obstacles){ o.x -= speed; }

    const rHit = { x: runner.x+8, y: runner.y-runner.h+8, w: runner.w-16, h: runner.h-10 };
    for(const o of obstacles){
      if(o.kind === 'collectible' && o.collected) continue;
      const oHit = { x:o.x+4, y:o.y+4, w:o.w-8, h:o.h-8 };
      if(rectsOverlap(rHit, oHit)){
        if(o.kind === 'obstacle'){
          endGame();
          return;
        } else {
          o.collected = true;
          score += 10;
          popups.push({ x:o.x, y:o.y, life:34 });
        }
      }
    }

    obstacles = obstacles.filter(o => o.x + o.w > -10 && !(o.kind==='collectible' && o.collected));

    for(const p of popups){ p.y -= 0.6; p.life--; }
    popups = popups.filter(p => p.life > 0);

    score += speed*0.045;
    document.getElementById('liveScore').textContent = Math.floor(score);
  }

  function drawGround(){
    ctx.strokeStyle = colors.sageDeep;
    ctx.globalAlpha = 0.55;
    ctx.lineWidth = 2;
    ctx.setLineDash([2,10]);
    ctx.beginPath();
    ctx.moveTo(0, groundY+2);
    ctx.lineTo(W, groundY+2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  function drawRunner(){
    const x = runner.x, yBase = runner.y;
    ctx.save();
    ctx.translate(x, yBase);

    // legs (behind body)
    ctx.strokeStyle = colors.ink;
    ctx.lineWidth = 3.4;
    ctx.lineCap = 'round';
    const swing = runner.onGround ? Math.sin(runner.legPhase)*10 : 4;
    ctx.beginPath();
    ctx.moveTo(-6,-14); ctx.lineTo(-6+swing, 1);
    ctx.moveTo(6,-14); ctx.lineTo(6-swing, 1);
    ctx.stroke();

    // body: tuxedo silhouette for groom, wedding dress silhouette for bride
    if(selectedChar === 'madoka'){
      ctx.fillStyle = '#FBF8F2';
      ctx.strokeStyle = 'rgba(140,156,126,.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(-9, -runner.h+8);
      ctx.lineTo(9, -runner.h+8);
      ctx.lineTo(7, -runner.h+21);
      ctx.lineTo(16, -runner.h+34);
      ctx.lineTo(-16, -runner.h+34);
      ctx.lineTo(-7, -runner.h+21);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.strokeStyle = colors.rose;
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(-7, -runner.h+21);
      ctx.lineTo(7, -runner.h+21);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#262A31';
      ctx.beginPath();
      ctx.roundRect(-14, -runner.h+8, 28, 26, 9);
      ctx.fill();
      ctx.fillStyle = '#FBF8F2';
      ctx.beginPath();
      ctx.moveTo(-5, -runner.h+8);
      ctx.lineTo(5, -runner.h+8);
      ctx.lineTo(3, -runner.h+26);
      ctx.lineTo(-3, -runner.h+26);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(-5,-runner.h+8); ctx.lineTo(-2,-runner.h+17);
      ctx.moveTo(5,-runner.h+8); ctx.lineTo(2,-runner.h+17);
      ctx.stroke();
    }

    // head: clipped photo if ready, otherwise a soft placeholder
    const headR = 15;
    const headCX = 0, headCY = -runner.h-4;
    if(faceImgReady){
      ctx.save();
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(faceImg, headCX-headR, headCY-headR, headR*2, headR*2);
      ctx.restore();
      ctx.strokeStyle = '#FBF8F2';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(140,156,126,.45)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR+1.4, 0, Math.PI*2);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#F5EEE3';
      ctx.beginPath();
      ctx.arc(headCX, headCY, headR, 0, Math.PI*2);
      ctx.fill();
    }

    // accessory: bowtie for groom, flower clip for bride
    if(selectedChar === 'madoka'){
      ctx.fillStyle = colors.rose;
      ctx.beginPath();
      ctx.arc(headCX+headR-4, headCY-headR+5, 4.5, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = colors.gold;
      ctx.beginPath();
      ctx.arc(headCX+headR-4, headCY-headR+5, 1.6, 0, Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillStyle = colors.gold;
      ctx.beginPath();
      ctx.moveTo(-5,-runner.h+7);
      ctx.lineTo(0,-runner.h+11);
      ctx.lineTo(5,-runner.h+7);
      ctx.lineTo(0,-runner.h+3);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  const OBSTACLE_EMOJI = { paper:'💻', storm:'👹', clock:'💸' };
  const COLLECTIBLE_EMOJI = { glass:'🍾', gift:'🎁', bouquet:'💐' };

  function drawEmojiIcon(o, emoji){
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.font = `${Math.round(Math.max(o.w, o.h) * 1.15)}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, o.w/2, o.h/2);
    ctx.restore();
  }

  function drawObstacleShape(o){
    drawEmojiIcon(o, OBSTACLE_EMOJI[o.type]);
  }

  function drawCollectible(o){
    if(o.collected) return;
    drawEmojiIcon(o, COLLECTIBLE_EMOJI[o.type]);
  }

  function drawPopups(){
    ctx.font = 'bold 15px "Cormorant Garamond", serif';
    ctx.fillStyle = colors.gold;
    for(const p of popups){
      ctx.globalAlpha = Math.max(0, p.life/34);
      ctx.fillText('+10', p.x, p.y);
    }
    ctx.globalAlpha = 1;
  }

  function render(){
    ctx.clearRect(0,0,W,H);
    drawGround();
    for(const o of obstacles){
      if(o.kind === 'obstacle'){ drawObstacleShape(o); }
      else { drawCollectible(o); }
    }
    drawPopups();
    drawRunner();
  }

  function loop(){
    if(running && !over){ update(); }
    render();
    requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    over = true;
    const finalScore = Math.floor(score);
    const isNewHighScore = finalScore > 0 && finalScore > best;
    if(isNewHighScore){
      best = finalScore;
      saveBest(best);
    }
    document.getElementById('overScore').textContent = 'スコア: ' + finalScore;
    document.getElementById('bestLine').textContent = '自己ベスト: ' + best;
    document.getElementById('liveBest').textContent = best;
    document.getElementById('highScoreBadge').style.display = isNewHighScore ? 'block' : 'none';
    document.getElementById('submitMsg').style.display = 'none';
    document.getElementById('nameInput').placeholder = 'お名前(ランキング用)';
    document.getElementById('overOverlay').classList.remove('hidden');
    window.__lastScore = finalScore;
  }

  function saveBest(v){
    try{
      localStorage.setItem('wedding-run-personal-best', String(v));
    }catch(e){}
  }

  function loadBest(){
    try{
      const v = localStorage.getItem('wedding-run-personal-best');
      if(v){ best = parseInt(v,10) || 0; }
    }catch(e){}
    document.getElementById('liveBest').textContent = best;
  }

  function subscribeLeaderboard(){
    db.ref('leaderboard').on('value', function(snap){
      const arr = [];
      snap.forEach(function(child){ arr.push(child.val()); });
      arr.sort((a,b)=>b.score-a.score);
      renderLeaderboard(arr.slice(0,5));
    }, function(e){
      console.error('leaderboard listener failed:', e);
      renderLeaderboard([]);
    });
  }

  function renderLeaderboard(arr){
    const listEl = document.getElementById('rankList');
    if(!arr || arr.length === 0){
      listEl.innerHTML = '<li class="empty">まだ記録がありません。最初の挑戦者になろう!</li>';
      return;
    }
    listEl.innerHTML = arr.slice(0,5).map(item =>
      `<li><span class="name">${escapeHtml(item.name)}</span><span class="pts">${item.score}</span></li>`
    ).join('');
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function submitScore(){
    const nameInput = document.getElementById('nameInput');
    const name = (nameInput.value || 'ゲスト').trim().slice(0,12) || 'ゲスト';
    const s = window.__lastScore || 0;
    const submitMsg = document.getElementById('submitMsg');

    try{
      await db.ref('leaderboard').push({ name, score: s, ts: Date.now() });
      nameInput.value = '';
      nameInput.placeholder = 'お名前(ランキング用)';
      submitMsg.textContent = '記録が登録されました!';
      submitMsg.style.color = 'var(--sage-deep)';
      submitMsg.style.display = 'block';
    }catch(e){
      console.error('submitScore failed:', e);
      submitMsg.textContent = '登録に失敗しました' + (e && e.code ? ' (' + e.code + ')' : '');
      submitMsg.style.color = 'var(--rose-deep)';
      submitMsg.style.display = 'block';
    }
  }

  function backToTop(){
    running = false;
    over = true;
    selectedChar = null;
    faceImgReady = false;
    document.getElementById('overOverlay').classList.add('hidden');
    document.getElementById('startOverlay').classList.add('hidden');
    document.getElementById('selectOverlay').classList.remove('hidden');
  }

  document.getElementById('retryBtn').addEventListener('click', (e)=>{ e.stopPropagation(); startGame(); });
  document.getElementById('backToTopBtn').addEventListener('click', (e)=>{ e.stopPropagation(); backToTop(); });
  document.getElementById('submitScore').addEventListener('click', (e)=>{ e.stopPropagation(); submitScore(); });
  document.getElementById('nameInput').addEventListener('click', (e)=>{ e.stopPropagation(); });
  document.getElementById('nameInput').addEventListener('keydown', (e)=>{ e.stopPropagation(); });

  document.querySelectorAll('.char-card').forEach(function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      selectedChar = btn.dataset.char;
      faceImgReady = false;
      const img = new Image();
      img.onload = function(){ faceImg = img; faceImgReady = true; };
      img.src = btn.querySelector('img').src;
      document.getElementById('selectOverlay').classList.add('hidden');
      document.getElementById('startOverlay').classList.remove('hidden');
    });
  });

  function tryJump(){
    if(!selectedChar) return;
    if(document.getElementById('overOverlay').classList.contains('hidden')===false) return;
    jump();
  }

  document.getElementById('stage').addEventListener('pointerdown', (e)=>{
    tryJump();
  });
  document.getElementById('jumpBtn').addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    e.stopPropagation();
    tryJump();
  });
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      tryJump();
    }
  });

  let resizeTimer = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeCanvas, 200);
  });

  resizeCanvas();
  loadBest();
  subscribeLeaderboard();
  render();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
