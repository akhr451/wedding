<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>写真を送る | 晃広 & まどか Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6F9FC;
    --ivory-deep:#EAF1F7;
    --blue:#7FA5C2;
    --blue-deep:#3B5B78;
    --orange:#E8A768;
    --orange-deep:#C97D3E;
    --ink:#263241;
    --ink-soft:#5c6b7a;
    --serif-jp: 'Shippori Mincho', serif;
    --serif-en: 'Cormorant Garamond', serif;
    --sans-jp: 'Zen Kaku Gothic New', sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:var(--sans-jp);
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}

  .wrap{max-width:640px;margin:0 auto;padding:0 28px;}

  /* ---------- page header ---------- */
  .page-header{padding:22px 0;border-bottom:1px solid rgba(127,165,194,.18);}
  .page-header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand-link{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:15px;
    color:var(--ink);
    text-decoration:none;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .back-link{
    font-family:var(--sans-jp);
    font-size:13px;
    color:var(--blue-deep);
    text-decoration:none;
    white-space:nowrap;
  }
  .back-link:hover{text-decoration:underline;}

  /* ---------- shared type ---------- */
  .eyebrow{
    font-family:var(--serif-en);
    font-style:italic;
    letter-spacing:.14em;
    color:var(--orange-deep);
    font-size:15px;
    text-transform:uppercase;
  }
  h2{
    font-family:var(--serif-jp);
    font-weight:600;
    font-size:26px;
    letter-spacing:.06em;
    color:var(--ink);
    margin:10px 0 6px;
  }
  .lead{color:var(--ink-soft);font-size:15px;margin:0 0 34px;}

  section{padding:56px 0 78px;position:relative;}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease, transform .9s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  /* ---------- notice / share card ---------- */
  .notice{
    background:linear-gradient(135deg, rgba(232,167,104,.14), rgba(127,165,194,.10));
    border-radius:22px;
    padding:32px 28px;
    text-align:center;
  }
  .notice p{margin:0;font-size:14.5px;color:var(--ink-soft);}
  .notice .notice-title{
    font-family:var(--serif-jp);
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin-bottom:10px;
  }

  .share-card{text-align:left;}
  .share-card p{margin:0 0 20px;font-size:14.5px;color:var(--ink-soft);}
  .share-form{margin-top:4px;}
  .field-label{
    display:block;
    font-family:var(--serif-en);
    font-style:italic;
    font-size:13px;
    color:var(--blue-deep);
    letter-spacing:.05em;
    margin:16px 0 6px;
  }
  .text-input, .textarea-input{
    display:block;
    width:100%;
    border:none;
    border-bottom:1px solid rgba(127,165,194,.4);
    background:transparent;
    font-family:var(--sans-jp);
    font-size:15px;
    color:var(--ink);
    padding:9px 2px;
    outline:none;
    transition:border-color .2s ease;
  }
  .text-input:focus, .textarea-input:focus{border-bottom-color:var(--orange-deep);}
  .textarea-input{resize:vertical;min-height:64px;line-height:1.7;}
  .char-count{
    text-align:right;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .file-drop{
    position:relative;
    margin-top:4px;
    border:1.5px dashed var(--blue);
    border-radius:16px;
    padding:26px 20px;
    text-align:center;
    color:var(--blue-deep);
    font-size:14px;
    transition:border-color .2s ease, background .2s ease;
  }
  .file-drop svg{margin:0 auto 8px;width:30px;height:30px;}
  .file-drop input[type=file]{
    position:absolute;inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;height:100%;
  }
  .file-drop.has-file{border-style:solid;border-color:var(--blue-deep);background:rgba(127,165,194,.06);}
  .thumb-preview{
    margin-top:14px;
    position:relative;
    display:inline-block;
  }
  .thumb-preview img{
    width:120px;height:120px;
    object-fit:cover;
    border-radius:14px;
    border:1px solid rgba(127,165,194,.3);
  }
  .thumb-remove{
    position:absolute;
    top:-8px;right:-8px;
    width:24px;height:24px;
    border-radius:50%;
    border:none;
    background:var(--orange-deep);
    color:#fff;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .submit-btn{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:8px;
    border:none;
    border-radius:999px;
    padding:14px 32px;
    background:var(--blue-deep);
    color:#fff;
    font-family:var(--sans-jp);
    font-size:14.5px;
    font-weight:700;
    letter-spacing:.03em;
    cursor:pointer;
    transition:background .2s ease, opacity .2s ease;
  }
  .submit-btn:hover{background:var(--orange-deep);}
  .submit-btn:disabled{opacity:.5;cursor:not-allowed;}
  .spinner{
    width:14px;height:14px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;
    animation:spin .8s linear infinite;
    display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .form-status{
    margin-top:14px;
    font-size:13.5px;
    min-height:1.2em;
  }
  .form-status.is-error{color:var(--orange-deep);}
  .form-status.is-success{color:var(--blue-deep);}
  .thanks-title{
    font-family:var(--serif-jp);
    font-weight:600;
    font-size:17px;
    color:var(--ink);
    margin-bottom:8px;
  }
  .thanks-again{
    display:inline-block;
    margin-top:10px;
    font-size:13px;
    color:var(--blue-deep);
    text-decoration:underline;
    cursor:pointer;
    background:none;border:none;padding:0;
    font-family:var(--sans-jp);
  }
  .honeypot-field{
    position:absolute;
    left:-9999px;
    top:-9999px;
    width:1px;height:1px;
    overflow:hidden;
  }
  .share-form[data-state="loading"] fieldset{opacity:.6;pointer-events:none;}

  footer{
    text-align:center;
    padding:60px 24px 50px;
  }
  footer .fmark{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:15px;
    color:var(--orange-deep);
    letter-spacing:.1em;
  }
  footer .fdate{
    margin-top:6px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .reveal{transition:none;opacity:1;transform:none;}
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="wrap page-header-inner">
    <a class="brand-link" href="index.html">晃広 &amp; まどか</a>
    <a class="back-link" href="index.html">&larr; トップに戻る</a>
  </div>
</header>

<section class="reveal">
  <div class="wrap">
    <div class="eyebrow">Share With Us</div>
    <h2>写真を送る</h2>
    <p class="lead">これまでの思い出の一枚や当日の写真を、ぜひ送ってください。</p>

    <div class="notice share-card" id="send-photo">
      <form class="share-form" id="photo-form" data-state="idle" novalidate>
        <fieldset style="border:none;padding:0;margin:0;">
          <input type="text" name="website" class="honeypot-field" tabindex="-1" autocomplete="off">

          <label class="field-label" for="photo-name">お名前(任意)</label>
          <input type="text" class="text-input" id="photo-name" maxlength="50" placeholder="例:山田太郎">

          <label class="field-label">写真</label>
          <div class="file-drop" id="photo-drop">
            <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 34V14a2 2 0 0 1 2-2h6l3-4h10l3 4h6a2 2 0 0 1 2 2v20a2 2 0 0 1-2 2H10a2 2 0 0 1-2-2z"/><circle cx="24" cy="24" r="7"/></svg>
            <span id="photo-drop-label">写真を選ぶ(カメラ / アルバム)</span>
            <input type="file" accept="image/*" id="photo-file">
          </div>
          <div id="photo-preview-wrap"></div>

          <label class="field-label" for="photo-caption">ひとこと(任意)</label>
          <textarea class="textarea-input" id="photo-caption" maxlength="200" rows="2" placeholder="写真に添えるメッセージ"></textarea>
          <div class="char-count"><span id="photo-caption-count">0</span>/200</div>

          <button type="submit" class="submit-btn" id="photo-submit">送る</button>
          <div class="form-status" id="photo-status" role="status"></div>
        </fieldset>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="fmark">Akihiro &amp; Madoka</div>
  <div class="fdate">2026.10.08</div>
</footer>

<script>
  // ---- reveal on scroll ----
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:.15});
  revealEls.forEach(el=>io.observe(el));

  // ---- photo sharing ----
  (function(){
    const GAS_ENDPOINT = "https://script.google.com/macros/s/AKfycbzQYXI-xxTIASjtIlWBUDKxjOyqhFsM8ps0JKjRHNlcu5Ru-QXDOBFYA4iiQ1ditvVI/exec";

    async function postToGAS(payload){
      const res = await fetch(GAS_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if(json.result !== 'success'){ throw new Error(json.message || '送信に失敗しました'); }
      return json;
    }

    async function compressImage(file, maxDim, quality){
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, maxDim / Math.max(bitmap.width, bitmap.height));
      const w = Math.round(bitmap.width * scale), h = Math.round(bitmap.height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));
    }

    function blobToBase64(blob){
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    function setStatus(el, message, kind){
      el.textContent = message || '';
      el.classList.remove('is-error','is-success');
      if(kind) el.classList.add(kind === 'error' ? 'is-error' : 'is-success');
    }

    function showThanks(form, title){
      form.innerHTML =
        '<div class="thanks-title">' + title + '</div>' +
        '<p style="margin:0;font-size:14px;color:var(--ink-soft);">お寄せいただきありがとうございます。</p>' +
        '<button type="button" class="thanks-again">もう一度送る</button>';
      form.dataset.state = 'success';
    }

    // ---- char counter ----
    const captionInput = document.getElementById('photo-caption');
    const captionCount = document.getElementById('photo-caption-count');
    if(captionInput && captionCount){
      captionInput.addEventListener('input', () => { captionCount.textContent = captionInput.value.length; });
    }

    // ---- photo form ----
    const photoForm = document.getElementById('photo-form');
    if(photoForm){
      const fileInput = document.getElementById('photo-file');
      const drop = document.getElementById('photo-drop');
      const dropLabel = document.getElementById('photo-drop-label');
      const previewWrap = document.getElementById('photo-preview-wrap');
      let chosenFile = null;

      fileInput.addEventListener('change', () => {
        const file = fileInput.files && fileInput.files[0];
        previewWrap.innerHTML = '';
        if(!file){ chosenFile = null; drop.classList.remove('has-file'); return; }
        if(!file.type.startsWith('image/')){
          setStatus(document.getElementById('photo-status'), '画像ファイルを選んでください。', 'error');
          fileInput.value = '';
          chosenFile = null;
          return;
        }
        if(file.size > 15 * 1024 * 1024){
          setStatus(document.getElementById('photo-status'), 'ファイルサイズが大きすぎます(15MBまで)。', 'error');
          fileInput.value = '';
          chosenFile = null;
          return;
        }
        chosenFile = file;
        drop.classList.add('has-file');
        dropLabel.textContent = file.name;
        setStatus(document.getElementById('photo-status'), '', null);

        const url = URL.createObjectURL(file);
        previewWrap.innerHTML =
          '<div class="thumb-preview"><img src="' + url + '" alt=""><button type="button" class="thumb-remove" aria-label="削除">×</button></div>';
        previewWrap.querySelector('.thumb-remove').addEventListener('click', () => {
          chosenFile = null;
          fileInput.value = '';
          previewWrap.innerHTML = '';
          drop.classList.remove('has-file');
          dropLabel.textContent = '写真を選ぶ(カメラ / アルバム)';
        });
      });

      photoForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusEl = document.getElementById('photo-status');
        if(!chosenFile){
          setStatus(statusEl, '写真を選んでください。', 'error');
          return;
        }
        const submitBtn = document.getElementById('photo-submit');
        photoForm.dataset.state = 'loading';
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span> 送信中…';
        setStatus(statusEl, '', null);
        try{
          const compressed = await compressImage(chosenFile, 1600, 0.82);
          const base64 = await blobToBase64(compressed);
          await postToGAS({
            type: 'photo',
            name: document.getElementById('photo-name').value,
            caption: document.getElementById('photo-caption').value,
            filename: chosenFile.name,
            mimeType: 'image/jpeg',
            data: base64,
            website: photoForm.website.value
          });
          showThanks(photoForm, '写真が届きました');
        }catch(err){
          photoForm.dataset.state = 'idle';
          submitBtn.disabled = false;
          submitBtn.textContent = '送る';
          setStatus(statusEl, '送信に失敗しました。電波の良い場所でもう一度お試しください。', 'error');
        }
      });
    }

    // ---- "send again" (event delegation, since form gets replaced with thanks markup) ----
    document.addEventListener('click', (e) => {
      if(e.target.classList.contains('thanks-again')){
        location.reload();
      }
    });
  })();
</script>

</body>
</html>
