<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お楽しみコンテンツ | 晃広 & まどか Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#F6F9FC;
    --ivory-deep:#EAF1F7;
    --blue:#7FA5C2;
    --blue-deep:#3B5B78;
    --orange:#E8A768;
    --orange-deep:#C97D3E;
    --ink:#263241;
    --ink-soft:#5c6b7a;
    --serif-jp: 'Shippori Mincho', serif;
    --serif-en: 'Cormorant Garamond', serif;
    --sans-jp: 'Zen Kaku Gothic New', sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:var(--sans-jp);
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}

  .wrap{max-width:640px;margin:0 auto;padding:0 28px;}

  /* ---------- page header ---------- */
  .page-header{padding:22px 0;border-bottom:1px solid rgba(127,165,194,.18);}
  .page-header-inner{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .brand-link{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:15px;
    color:var(--ink);
    text-decoration:none;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .back-link{
    font-family:var(--sans-jp);
    font-size:13px;
    color:var(--blue-deep);
    text-decoration:none;
    white-space:nowrap;
  }
  .back-link:hover{text-decoration:underline;}

  /* ---------- shared type ---------- */
  .eyebrow{
    font-family:var(--serif-en);
    font-style:italic;
    letter-spacing:.14em;
    color:var(--orange-deep);
    font-size:15px;
    text-transform:uppercase;
  }
  h2{
    font-family:var(--serif-jp);
    font-weight:600;
    font-size:26px;
    letter-spacing:.06em;
    color:var(--ink);
    margin:10px 0 6px;
  }
  .lead{color:var(--ink-soft);font-size:15px;margin:0 0 34px;}

  section{padding:56px 0 78px;position:relative;}
  .reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease, transform .9s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  /* ---------- nav cards (movie / game) ---------- */
  .share-nav{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
  }
  .share-nav-card{
    display:block;
    background:var(--ivory-deep);
    border-radius:22px;
    padding:30px 20px;
    text-align:center;
    text-decoration:none;
    border:1px solid rgba(127,165,194,.25);
    transition:transform .2s ease, border-color .2s ease;
  }
  .share-nav-card:hover{transform:translateY(-3px);border-color:var(--blue-deep);}
  .share-nav-icon{
    width:38px;height:38px;
    margin:0 auto 14px;
    color:var(--blue-deep);
  }
  .share-nav-icon svg{width:100%;height:100%;}
  .share-nav-title{
    font-family:var(--serif-jp);
    font-weight:600;
    font-size:16px;
    color:var(--ink);
    margin-bottom:6px;
  }
  .share-nav-desc{font-size:13px;color:var(--ink-soft);}

  @media (max-width:420px){
    .share-nav{grid-template-columns:1fr;}
  }

  footer{
    text-align:center;
    padding:60px 24px 50px;
  }
  footer .fmark{
    font-family:var(--serif-en);
    font-style:italic;
    font-size:15px;
    color:var(--orange-deep);
    letter-spacing:.1em;
  }
  footer .fdate{
    margin-top:6px;
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.08em;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    .reveal{transition:none;opacity:1;transform:none;}
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="wrap page-header-inner">
    <a class="brand-link" href="index.html">晃広 &amp; まどか</a>
    <a class="back-link" href="index.html">&larr; トップに戻る</a>
  </div>
</header>

<section class="reveal">
  <div class="wrap">
    <div class="eyebrow">Enjoy</div>
    <h2>お楽しみコンテンツ</h2>
    <p class="lead">動画やゲームなど、楽しいコンテンツをご用意しています。</p>

    <div class="share-nav">
      <a class="share-nav-card" href="movie.html">
        <div class="share-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4.5-2.5z"/></svg>
        </div>
        <div class="share-nav-title">動画</div>
        <div class="share-nav-desc">どんな動画が公開されるかはお楽しみ!</div>
      </a>
      <a class="share-nav-card" href="game.html">
        <div class="share-nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="8" width="20" height="10" rx="5"/><path d="M7 11v4M5 13h4"/><circle cx="16" cy="12" r="1"/><circle cx="18.5" cy="14.5" r="1"/></svg>
        </div>
        <div class="share-nav-title">ゲーム</div>
        <div class="share-nav-desc">お楽しみいただけるゲーム</div>
      </a>
    </div>
  </div>
</section>

<footer>
  <div class="fmark">Akihiro &amp; Madoka</div>
  <div class="fdate">2026.10.08</div>
</footer>

<script>
  // ---- reveal on scroll ----
  const revealEls = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
    });
  }, {threshold:.15});
  revealEls.forEach(el=>io.observe(el));
</script>

</body>
</html>
